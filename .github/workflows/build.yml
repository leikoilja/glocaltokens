name: Build the package

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare and install deps
        uses: ./.github/actions/install-deps
        with:
          python-version: "3.14"

      - name: Check if package builds
        run: uv build

      # Install the wheel into a new environment and import it with -I, so the
      # source tree can't stand in for it. This catches a wrong package path, a
      # missing typing marker or copyright notice, runtime dependencies or a
      # Python requirement that differ from pyproject.toml, and imports the
      # declared dependencies don't cover. packaging is added only to compare
      # the requirements. Bash expands the wheel's file name on Windows too.
      - name: Check the built wheel
        shell: bash
        run: |
          uv run --isolated --no-project --with dist/*.whl --with packaging python -I - <<'EOF'
          import pathlib
          import sys
          from importlib import metadata
          import tomllib

          from packaging.markers import Marker
          from packaging.requirements import Requirement
          from packaging.specifiers import SpecifierSet
          from packaging.utils import canonicalize_name

          import glocaltokens
          import glocaltokens.client

          # The wheel's metadata adds the extra's name to the marker of each
          # optional dependency, as `(<own marker>) and extra == '<name>'`.
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          expected = {Requirement(dep) for dep in project["dependencies"]}
          for extra, deps in project.get("optional-dependencies", {}).items():
              for req in map(Requirement, deps):
                  condition = f"extra == '{canonicalize_name(extra)}'"
                  req.marker = Marker(f"({req.marker}) and {condition}" if req.marker else condition)
                  expected.add(req)

          dist = metadata.distribution(project["name"])
          requires = {Requirement(req) for req in dist.requires or ()}
          assert pathlib.Path(glocaltokens.__file__) == dist.locate_file("glocaltokens/__init__.py")
          assert "glocaltokens/py.typed" in {str(path) for path in dist.files or ()}
          assert requires == expected, {
              "wheel only": sorted(map(str, requires - expected)),
              "pyproject.toml only": sorted(map(str, expected - requires)),
          }
          python_requires = {"wheel": dist.metadata["Requires-Python"], "pyproject.toml": project["requires-python"]}
          assert SpecifierSet(python_requires["wheel"]) == SpecifierSet(python_requires["pyproject.toml"]), python_requires
          assert "Copyright (c) 2021 Ilja Leiko" in (dist.read_text("licenses/LICENSE") or "")
          print(f"glocaltokens {dist.version} on Python {sys.version}")
          EOF

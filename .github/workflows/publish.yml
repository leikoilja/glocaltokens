name: Publish to PyPI

concurrency: release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  publish:
    name: Publish
    if: github.repository_owner == 'leikoilja'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare and install deps
        uses: ./.github/actions/install-deps
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: uv build

      # Unlike `uv publish`, the action also creates PEP 740 attestations,
      # which PyPI shows as verified provenance for each file.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

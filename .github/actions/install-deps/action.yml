name: "Common steps to install and cache dependencies"

inputs:
  python-version:
    description: "Python version to set up"
    required: false
    default: "3.14"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies with uv
      shell: bash
      run: uv sync

# Schema reference: https://github.com/actions/labeler#match-object
# Options inside `all` are AND-ed. The dependency rule needs every change to be
# inside its listed files; the GitHub structure and documentation rules can
# also match mixed changes. Pull requests touching Python source need a manual
# type label. Dependabot labels its own pull requests, so its branches are
# skipped here.

dependencies:
  - all:
      - head-branch: ["^(?!dependabot/)"]
      - changed-files:
          # A dependency update only: nothing outside these files changed.
          - any-glob-to-any-file: "uv.lock"
          # One combined pattern: any-glob-to-all-files asks whether a
          # single glob matches every changed file, so a list of two would
          # never match the usual pair.
          - any-glob-to-all-files: "{uv.lock,pyproject.toml}"

github structure:
  - all:
      - head-branch: ["^(?!dependabot/)"]
      - changed-files:
          - any-glob-to-any-file: ".github/**/*"
          - all-globs-to-all-files: "!**/*.py"

documentation:
  - all:
      - head-branch: ["^(?!dependabot/)"]
      - changed-files:
          - any-glob-to-any-file: "**/*.md"
          - all-globs-to-all-files:
              - "!**/*.py"
              - "!.github/**/*"

test:
  - all:
      - head-branch: ["^(?!dependabot/)"]
      - changed-files:
          - any-glob-to-any-file: "tests/**/*"
          - all-globs-to-all-files: "!glocaltokens/**/*"
